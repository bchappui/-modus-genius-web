<title>Coupon icon options</title>
<style>
:root {
  --bg: #0a1526;
  --card: linear-gradient(135deg, #1a2e46 0%, #0d1b2e 60%, #0a1526 100%);
  --line: rgba(255,255,255,0.1);
  --text: rgba(220,230,245,0.9);
  --text-dim: rgba(220,230,245,0.5);
  --gradient: linear-gradient(90deg, #e8412c, #f5941f, #f7d038, #6fbf4a, #29c3c8, #3f8ce8, #9b6fe0, #e15fc0);
}
* { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100vh;
  background: var(--bg);
  color: var(--text);
  font-family: 'Roboto', system-ui, -apple-system, sans-serif;
  padding: 48px 5vw 80px;
}
h1 {
  font-size: 22px;
  font-weight: 900;
  margin: 0 0 6px;
}
.sub {
  color: var(--text-dim);
  font-size: 14px;
  margin: 0 0 40px;
  max-width: 560px;
  line-height: 1.5;
}
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
  gap: 20px;
  max-width: 1100px;
}
.option {
  border-radius: 14px;
  border: 1px solid var(--line);
  background: rgba(255,255,255,0.03);
  padding: 22px 20px 18px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}
.option-name {
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.3px;
  color: var(--text-dim);
}
.swatches {
  display: flex;
  align-items: center;
  gap: 18px;
}
.swatch {
  width: 34px;
  height: 34px;
  flex-shrink: 0;
}
.swatch.white svg { fill: #fff; width: 100%; height: 100%; }
.swatch.gradient {
  background: var(--gradient);
  -webkit-mask-size: contain;
  -webkit-mask-repeat: no-repeat;
  -webkit-mask-position: center;
  mask-size: contain;
  mask-repeat: no-repeat;
  mask-position: center;
}
.badge-preview {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  align-self: flex-start;
  padding: 4px 10px;
  border-radius: 5px;
  background: rgba(255,255,255,0.12);
}
.badge-preview .icon {
  width: 12px;
  height: 12px;
  flex-shrink: 0;
}
.badge-preview .icon.white svg { fill: #fff; width: 100%; height: 100%; }
.badge-preview .icon.gradient {
  background: var(--gradient);
  -webkit-mask-size: contain;
  -webkit-mask-repeat: no-repeat;
  -webkit-mask-position: center;
  mask-size: contain;
  mask-repeat: no-repeat;
  mask-position: center;
}
.badge-preview .text {
  font-weight: 900;
  font-size: 10px;
  letter-spacing: 0.5px;
  background: var(--gradient);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}
</style>

<h1>Coupon icon candidates</h1>
<p class="sub">react-icons/ri (Remix Icon) has literal coupon/ticket/tag icons — closer to the subject than the generic price-tag glyph. Each card shows the icon plain white, as the rainbow-gradient mask, and inline at real badge scale next to "FREE CARD INSIDE!".</p>

<div class="grid" id="grid"></div>
